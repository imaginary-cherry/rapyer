name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mirror-redis:
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    outputs:
      image: ${{ steps.mirror.outputs.image }}
    steps:
    - uses: actions/checkout@v5
    - id: mirror
      uses: ./.github/actions/mirror-redis
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    runs-on: ubuntu-22.04
    needs: [mirror-redis]
    environment:
      name: coverage
    permissions:
      contents: read
      packages: read

    services:
      redis:
        image: ${{ needs.mirror-redis.outputs.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6370:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run coverage
        env:
          REDIS_DB: 0
        run: tox -e coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

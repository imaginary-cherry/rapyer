name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-branch-target:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
    - name: Validate PR target branch
      env:
        SOURCE_BRANCH: ${{ github.head_ref }}
        TARGET_BRANCH: ${{ github.base_ref }}
      run: |
        echo "Source branch: $SOURCE_BRANCH"
        echo "Target branch: $TARGET_BRANCH"

        # Rule 1: Only develop branch can merge to main
        if [[ "$TARGET_BRANCH" == "main" && "$SOURCE_BRANCH" != "develop" ]]; then
          echo "❌ Error: Only 'develop' branch can merge to 'main'"
          echo "Your branch '$SOURCE_BRANCH' cannot target 'main' directly"
          echo "Please target 'develop' branch instead"
          exit 1
        fi
        
        echo "✅ Branch targeting rules validated successfully"

  # Mirror the Redis server image into GHCR once; the test job pulls the service
  # container from there (no Docker Hub rate limit). See .github/actions/mirror-redis.
  mirror-redis:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.mirror.outputs.image }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - id: mirror
      uses: ./.github/actions/mirror-redis
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # Build the redis test matrix from .github/redis-matrix.json: all versions when
  # the branch maps to 0, otherwise a random sample of that branch's count.
  setup-matrix:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    needs: [validate-branch-target]
    outputs:
      redis-versions: ${{ steps.pick.outputs.redis }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - id: pick
      env:
        TARGET: ${{ github.base_ref || github.ref_name }}
      run: |
        CFG=.github/redis-matrix.json
        COUNT=$(jq -r --arg b "$TARGET" '.sample_per_branch[$b] // .sample_per_branch.default' "$CFG")
        ALL=$(jq -r '.versions[]' "$CFG")
        if [ "$COUNT" = "0" ]; then PICK="$ALL"; else PICK=$(shuf -n "$COUNT" <<< "$ALL"); fi
        echo "redis=$(jq -R . <<< "$PICK" | jq -cs .)" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-22.04
    needs: [validate-branch-target]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync --locked --group dev

    - name: Check import ordering and unused imports with ruff
      run: uv run ruff check --diff .

    - name: Check code formatting with black
      run: uv run black --check --diff .

  mypy:
    runs-on: ubuntu-22.04
    needs: [validate-branch-target]
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox
    
    - name: Run mypy type checking
      run: tox -e mypy


  test:
    runs-on: ubuntu-22.04
    needs: [validate-branch-target, mirror-redis, setup-matrix]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        redis-version: ${{ fromJSON(needs.setup-matrix.outputs.redis-versions) }}
        pydantic-version: ["2.11", "2.12", "2.13"]

    services:
      redis:
        image: ${{ needs.mirror-redis.outputs.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6370:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: pip-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          pip-test-${{ runner.os }}-${{ matrix.python-version }}-
          pip-test-${{ runner.os }}-

    - name: Cache tox environments
      uses: actions/cache@v5
      with:
        path: .tox
        key: tox-${{ runner.os }}-py${{ matrix.python-version }}-redis${{ matrix.redis-version }}-pydantic${{ matrix.pydantic-version }}-${{ hashFiles('tox.ini', 'pyproject.toml') }}
        restore-keys: |
          tox-${{ runner.os }}-py${{ matrix.python-version }}-redis${{ matrix.redis-version }}-pydantic${{ matrix.pydantic-version }}-
          tox-${{ runner.os }}-py${{ matrix.python-version }}-
    
    - name: Install tox and tox-gh-actions
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    
    - name: Run tests with tox
      env:
        REDIS_DB: 0
      run: tox -e py$(echo "${{ matrix.python-version }}" | tr -d '.')-redis$(echo "${{ matrix.redis-version }}" | tr -d '.')-pydantic$(echo "${{ matrix.pydantic-version }}" | tr -d '.')


  test-results:
    runs-on: ubuntu-22.04
    needs: [validate-branch-target, lint, mypy, test]
    permissions:
      contents: read
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.validate-branch-target.result }}" == "failure" ]]; then
            echo "Branch target validation failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.mypy.result }}" != "success" ]]; then
            echo "MyPy job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          echo "All checks passed successfully!"


# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Runs Semgrep tokenless with the auto config (community rules selected
# for this project). No Semgrep.dev account is required. Results are
# uploaded to GitHub code scanning (Security tab).
#
# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '29 23 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      # Checkout project source
      - uses: actions/checkout@v6

      # Scan code tokenless with the auto ruleset, emitting a SARIF report.
      # Exclude the Python 3.7 importlib compat rule: this project targets
      # Python >=3.10, so importlib.resources is always available.
      - name: Run Semgrep
        run: >-
          semgrep ci --config=auto
          --exclude-rule python.lang.compatibility.python37.python37-compatibility-importlib2
          --sarif --output=semgrep.sarif
        continue-on-error: true

      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()
